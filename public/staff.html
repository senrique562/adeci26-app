<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ADECI26 · Escáner del stand</title>
<meta name="theme-color" content="#0b1524" />
<link rel="icon" href="/img/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/app.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<style>
  body{background:#0b1524;color:#fff}
  #app{background:#0b1524;padding-bottom:24px}
  .head{padding:calc(16px + var(--sat)) 18px 12px;display:flex;align-items:center;gap:12px}
  .head .r{font-size:10.5px;font-weight:800;letter-spacing:2.4px;text-transform:uppercase;color:#ff8a72}
  .head h3{font-size:19px;font-weight:900;margin-top:2px}
  .head img{height:26px;margin-left:auto}
  .viewport{margin:8px 18px 0;aspect-ratio:1;border-radius:18px;background:#16233a;position:relative;overflow:hidden}
  .viewport video{width:100%;height:100%;object-fit:cover;display:block}
  .viewport .frame{position:absolute;inset:19%;border-radius:14px;box-shadow:0 0 0 2px rgba(255,255,255,.45),0 0 0 2000px rgba(0,0,0,.25)}
  .viewport .laser{position:absolute;left:19%;right:19%;height:2px;background:var(--celeste);box-shadow:0 0 12px var(--celeste);animation:scan 2.2s ease-in-out infinite}
  @keyframes scan{0%,100%{top:22%}50%{top:76%}}
  .viewport .msg{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:#8ea3bd;font-size:14px;line-height:1.5}
  .hit{margin:14px 18px 0;background:#fff;border-radius:14px;padding:15px;color:var(--txt);animation:up .25s}
  .hit .ok{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--teal)}
  .hit.dup .ok{color:var(--azul)}.hit.err .ok{color:var(--navy)}
  .hit .nm{font-size:19px;font-weight:900;color:var(--navy);margin-top:3px}
  .hit .in{font-size:13px;color:var(--txt-3);margin-top:3px}
  .hit .hab{display:inline-block;margin-top:8px;font-size:11.5px;font-weight:800;letter-spacing:1px;text-transform:uppercase;padding:5px 10px;border-radius:99px;background:var(--celeste-grey);color:var(--navy)}
  .hit .hab.on{background:var(--teal);color:#fff}
  .manual{margin:14px 18px 0;display:flex;gap:8px}
  .manual input{flex:1;border:1px solid #2b3b57;background:#16233a;color:#fff;border-radius:11px;padding:12px;font-size:16px;letter-spacing:2px;text-transform:uppercase;outline:0}
  .stats{margin:18px 18px 0;display:flex;gap:10px}
  .stats div{flex:1;background:#16233a;border-radius:12px;padding:12px;text-align:center}
  .stats b{display:block;font-size:24px;font-weight:900}
  .stats span{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:#8ea3bd;font-weight:800}
  .login{background:#0b1524}
  .login .plate{background:#fff;color:var(--txt)}
  .foot{color:#8ea3bd;font-size:12.5px;text-align:center;margin:18px 18px 0;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" style="bottom:20px"></div>
<script>
const LS='adeci26:staff'; const $=(s)=>document.querySelector(s);
let token=localStorage.getItem(LS+':token')||'', me=JSON.parse(localStorage.getItem(LS+':me')||'null');
let stream=null, scanning=false, lastCode='', lastAt=0, inscriptos=0, hoyCount=0;
const pendiente=new URLSearchParams(location.search).get('c'); // código que viene de un QR abierto con la cámara del teléfono
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt; function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000);}
async function api(a,b={}){const h={'content-type':'application/json'};if(token)h.authorization='Bearer '+token;const r=await fetch('/api/'+a,{method:'POST',headers:h,body:JSON.stringify(b)});const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok){if(r.status===401){logout();}throw new Error(d.error||'Error');}return d;}
function logout(){token='';me=null;localStorage.removeItem(LS+':token');localStorage.removeItem(LS+':me');stopCam();render();}

function render(){
  if(!token||!me){ $('#app').innerHTML=`<div class="login">
    <div class="plate"><img src="/img/adox-logo.png" alt="ADOX" style="width:70%;display:block;margin:0 auto 16px">
      <h2>Stand ADOX · Escáner</h2><p>Registra en el sorteo a quienes completaron los 5 momentos y entrega el regalo. Ingresá tu correo y el PIN.</p>
      <form id="f" class="mt">
        <div class="field"><label>Correo</label><input name="email" type="email" required autocomplete="email"></div>
        <div class="field"><label>PIN</label><input name="pin" type="password" inputmode="numeric" required autocomplete="one-time-code"></div>
        <div class="error" id="err" hidden></div>
        <button class="btn btn-adox full" type="submit">Entrar</button>
      </form></div>
    <div class="foot">Si no tenés acceso, pedíselo a la organización del congreso.</div></div>`;
    $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const d=await api('staff_login',{email:fd.get('email'),pin:fd.get('pin')});token=d.token;me={email:d.email,role:d.role};localStorage.setItem(LS+':token',token);localStorage.setItem(LS+':me',JSON.stringify(me));render();startCam();cargarStats(); if(pendiente){setTimeout(()=>procesar(pendiente),600); history.replaceState(null,'',location.pathname);}}catch(er){$('#err').textContent=er.message;$('#err').hidden=false;}};
    return;
  }
  $('#app').innerHTML=`<div class="head"><div><div class="r">Stand ADOX · Sorteo y regalo</div><h3>Escanear credencial</h3></div><img src="/img/adox-wordmark-white.png" alt="ADOX"></div>
    <div class="viewport"><video id="v" playsinline muted></video><div class="frame"></div><div class="laser"></div><div class="msg" id="msg" hidden></div></div>
    <div id="hit"></div>
    <form class="manual" id="fm"><input id="code" placeholder="o escribí el código" maxlength="12" autocomplete="off"><button class="btn btn-adox" type="submit">OK</button></form>
    <div class="stats"><div><b id="stTotal">–</b><span>inscriptos al sorteo</span></div><div><b id="stMias">${hoyCount}</b><span>en este teléfono</span></div></div>
    <div class="foot">Solo se inscribe a quien tiene las 5 gotas. Cada credencial una sola vez.<br>${esc(me.email)} · <button class="link" id="out" style="color:#8ea3bd">salir</button></div>`;
  $('#fm').onsubmit=e=>{e.preventDefault();const c=$('#code').value.trim();if(c){procesar(c);$('#code').value='';}};
  $('#out').onclick=()=>{if(confirm('¿Salir del modo stand?'))logout();};
}

async function startCam(){
  const v=$('#v'); if(!v) return;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:1280}}});
    v.srcObject=stream; await v.play(); scanning=true; loop();
  }catch(e){ const m=$('#msg'); m.hidden=false; m.textContent='No pudimos abrir la cámara. Permitile el acceso al navegador o escribí el código de la credencial abajo.'; }
}
function stopCam(){scanning=false; if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
const cv=document.createElement('canvas'); const cx=cv.getContext('2d',{willReadFrequently:true});
function loop(){
  if(!scanning) return;
  const v=$('#v');
  if(v&&v.readyState===v.HAVE_ENOUGH_DATA&&window.jsQR){
    const s=Math.min(v.videoWidth,v.videoHeight); cv.width=cv.height=Math.min(s,640);
    cx.drawImage(v,(v.videoWidth-s)/2,(v.videoHeight-s)/2,s,s,0,0,cv.width,cv.height);
    const img=cx.getImageData(0,0,cv.width,cv.height);
    const q=jsQR(img.data,img.width,img.height,{inversionAttempts:'dontInvert'});
    if(q&&q.data){ const code=q.data.trim(); const now=Date.now(); if(code!==lastCode||now-lastAt>4000){lastCode=code;lastAt=now;procesar(code);} }
  }
  requestAnimationFrame(loop);
}
let busy=false;
async function procesar(code){
  if(busy) return; busy=true;
  const uid=code.toUpperCase().replace(/^.*[?&]C=/,'').replace(/^ADECI26:/,'').replace(/[^A-Z0-9].*$/,'');
  const hit=$('#hit');
  try{
    const d=await api('staff_scan',{uid});
    if(!d.ok){ // le faltan momentos
      if(navigator.vibrate) navigator.vibrate([200,80,200]);
      const faltan=['m1','m2','m3','m4','m5'].filter(k=>!d.progreso.momentos[k]).map(k=>({m1:'llegada',m2:'trivia',m3:'e-pósters',m4:'comentarios',m5:'Conocé ADOX'})[k]);
      hit.innerHTML=`<div class="hit err"><div class="ok">Todavía no puede inscribirse</div><div class="nm">${esc(d.user.nombre)} ${esc(d.user.apellido)}</div><div class="in">${d.progreso.gotas} de 5 gotas · le falta: ${faltan.join(', ')}</div></div>`;
    } else {
      if(navigator.vibrate) navigator.vibrate(d.yaEstaba?[60,60,60]:120);
      if(!d.yaEstaba){hoyCount++;inscriptos++;}
      hit.innerHTML=`<div class="hit ${d.yaEstaba?'dup':''}"><div class="ok">${d.yaEstaba?'Ya estaba inscripto · regalo ya entregado':'✓ Inscripto en el sorteo · entregar regalo'}</div>
        <div class="nm">${esc(d.user.nombre)} ${esc(d.user.apellido)}</div><div class="in">${esc(d.user.email)} · 5 de 5 gotas</div></div>`;
    }
    pintarStats();
  }catch(e){ hit.innerHTML=`<div class="hit err"><div class="ok">No se pudo acreditar</div><div class="nm" style="font-size:15px">${esc(e.message)}</div></div>`; if(navigator.vibrate) navigator.vibrate([200,80,200]); }
  setTimeout(()=>{busy=false;},1200);
}
function pintarStats(){const t=$('#stTotal'),m=$('#stMias');if(t)t.textContent=inscriptos;if(m)m.textContent=hoyCount;}
async function cargarStats(){try{const d=await api('staff_stats');inscriptos=d.inscriptos||0;pintarStats();}catch{}}
render(); if(token&&me){startCam();cargarStats();setInterval(cargarStats,30000); if(pendiente){setTimeout(()=>procesar(pendiente),400); history.replaceState(null,'',location.pathname);}}
document.addEventListener('visibilitychange',()=>{ if(!token) return; if(document.visibilityState==='visible'){ if(!stream) startCam(); } else stopCam(); });
</script>
</body>
</html>
