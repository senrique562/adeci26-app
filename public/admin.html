<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ADECI26 · Panel</title>
<link rel="icon" href="/img/icon-192.png" />
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/css/app.css" />
<style>
  body{background:#eaeff6}
  #app{max-width:1080px;padding:0 0 40px;background:transparent;box-shadow:none}
  .top{background:var(--navy-deep);color:#fff;padding:14px 22px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .top .word{font-size:18px;font-weight:900}.top .word span{color:var(--celeste)}
  .tabs{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
  .tabs button{border:0;background:rgba(255,255,255,.1);color:#fff;border-radius:9px;padding:8px 12px;font-size:13px;font-weight:800}
  .tabs button.on{background:#fff;color:var(--navy)}
  .wrap{padding:20px 22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
  .kpi{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
  .kpi b{display:block;font-size:30px;font-weight:900;color:var(--navy);letter-spacing:-.8px}
  .kpi span{font-size:11px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;color:var(--txt-3)}
  table{width:100%;border-collapse:collapse;font-size:13.5px;background:#fff}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--txt-3)}
  .q{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .q .field{margin-bottom:8px}
  .q input,.q textarea{padding:9px 11px;font-size:14px}
  .opts{display:grid;grid-template-columns:auto 1fr;gap:6px 8px;align-items:center}
  .winner{background:var(--grad);color:#fff;border-radius:18px;padding:26px;text-align:center}
  .winner .n{font-size:34px;font-weight:900;letter-spacing:-.8px;margin:6px 0}
  .winner .e{color:var(--celeste-pale)}
  .login{background:#eaeff6;color:var(--txt)}
  .login .plate{max-width:420px;margin:0 auto}
  .bar{height:8px;background:var(--celeste-grey);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal)}
  .pill{display:inline-block;font-size:11px;font-weight:800;padding:3px 8px;border-radius:99px;background:var(--celeste-grey);color:var(--navy)}
  .pill.g{background:#e9f8f1;color:#1a7a52}.pill.r{background:#fdeeee;color:#9b1c1c}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .ov{display:grid;grid-template-columns:110px 1fr 1fr;gap:8px;align-items:start;padding:8px 0;border-bottom:1px solid var(--line);font-size:13px}
  .ov input{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:13px}
  .ov .orig{color:var(--txt-3);font-size:12px;margin-top:4px}
  @media(max-width:700px){.ov{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast" style="bottom:20px"></div>
<script type="module">
import { PROGRAMA, DIAS } from '/data/programa.js';
import { speaker } from '/data/speakers.js';
const LS='adeci26:admin'; const $=(s)=>document.querySelector(s);
let token=localStorage.getItem(LS+':token')||'', me=JSON.parse(localStorage.getItem(LS+':me')||'null'), tab='metricas';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tt; function toast(m,err){const t=$('#toast');t.textContent=m;t.className='toast on'+(err?' err':'');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),3000);}
async function api(a,b={}){const h={'content-type':'application/json'};if(token)h.authorization='Bearer '+token;const r=await fetch('/api/'+a,{method:'POST',headers:h,body:JSON.stringify(b)});if(r.headers.get('content-type')?.includes('text/csv')){return await r.text();}const d=await r.json().catch(()=>({error:'Respuesta inválida'}));if(!r.ok){if(r.status===401)logout();throw new Error(d.error||'Error');}return d;}
function logout(){token='';me=null;localStorage.removeItem(LS+':token');localStorage.removeItem(LS+':me');render();}
const fecha=ts=>new Date(ts).toLocaleString('es-AR',{timeZone:'America/Argentina/Cordoba',hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit'});
const titulo=id=>PROGRAMA.find(s=>s.id===id)?.titulo||id;

const TABS={metricas:'Métricas',avisos:'Avisos',trivia:'Trivia',sorteo:'Sorteo',staff:'Staff ADOX',programa:'Programa',config:'Configuración'};

async function render(){
  if(!token||!me){
    $('#app').innerHTML=`<div class="login"><div class="plate"><img src="/img/adeci-logo.jpg" alt="ADECI26" style="width:60%;display:block;margin:0 auto 14px"><h2>Panel de administración</h2><p>Acceso para la organización del congreso.</p>
      <form id="f" class="mt"><div class="field"><label>Correo</label><input name="email" type="email" required></div><div class="field"><label>PIN</label><input name="pin" type="password" required></div><div class="error" id="err" hidden></div><button class="btn btn-p full">Entrar</button></form></div></div>`;
    $('#f').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{const d=await api('admin_login',{email:fd.get('email'),pin:fd.get('pin')});token=d.token;me={email:d.email};localStorage.setItem(LS+':token',token);localStorage.setItem(LS+':me',JSON.stringify(me));render();}catch(er){$('#err').textContent=er.message;$('#err').hidden=false;}};
    return;
  }
  $('#app').innerHTML=`<div class="top"><div class="word">ADECI<span>26</span> · Panel</div><div class="tabs">${Object.entries(TABS).map(([k,v])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${v}</button>`).join('')}<button id="out" title="${esc(me.email)}">Salir</button></div></div><div class="wrap" id="wrap"><div class="spinner"></div></div>`;
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();});
  $('#out').onclick=logout;
  try{ await ({metricas,avisos,trivia,sorteo,staff,programa,config})[tab](); }catch(e){ $('#wrap').innerHTML=`<div class="error">${esc(e.message)}</div>`; }
}

// ───────── métricas ─────────
async function metricas(){
  const m=await api('admin_metricas');
  const pct=n=>m.total?Math.round(n/m.total*100):0;
  const fila=(k,label)=>`<tr><td>${label}</td><td><b>${m[k]}</b></td><td style="width:40%"><div class="bar"><i style="width:${pct(m[k])}%"></i></div></td><td>${pct(m[k])}%</td></tr>`;
  const cps=Object.entries(m.comentariosPorSesion||{}).sort((a,b)=>b[1]-a[1]);
  $('#wrap').innerHTML=`<div class="grid">
    <div class="kpi"><span>Registrados</span><b>${m.total}</b></div>
    <div class="kpi"><span>Visitaron el stand</span><b>${m.m5}</b></div>
    <div class="kpi"><span>Habilitados para el sorteo (5/5)</span><b>${m.completos}</b></div>
    <div class="kpi"><span>Comentarios de sesiones</span><b>${m.comentarios}</b></div>
  </div>
  <div class="sec-t">Avance por momento</div>
  <div class="card" style="padding:0;overflow:hidden"><table>
    ${fila('m1','1 · Check-in')}${fila('m2','2 · Trivia')}${fila('m3','3 · E-pósters')}${fila('m4','4 · Tres comentarios')}${fila('m5','5 · Visita al stand')}
    <tr><td colspan="4" style="color:var(--txt-3)">Check-in día 1: <b>${m.checkinD1}</b> · día 2: <b>${m.checkinD2}</b> &nbsp;|&nbsp; Trivia día 1: <b>${m.triviaD1}</b> · día 2: <b>${m.triviaD2}</b> &nbsp;|&nbsp; Gotas repartidas: <b>${m.gotasTotal}</b></td></tr>
  </table></div>
  <div class="sec-t">Distribución</div>
  <div class="card"><div class="actions">${m.porCompletos.map((n,i)=>`<span class="pill ${i===5?'g':''}">${i} momento${i===1?'':'s'}: ${n}</span>`).join('')}</div></div>
  <div class="sec-t">Comentarios por sesión</div>
  <div class="card" style="padding:0;overflow:hidden"><table>${cps.length?cps.map(([id,n])=>`<tr><td style="color:var(--txt-3);white-space:nowrap">${id}</td><td>${esc(titulo(id))}</td><td><b>${n}</b></td></tr>`).join(''):'<tr><td class="muted">Todavía no hay comentarios.</td></tr>'}</table></div>
  <div class="sec-t">Exportar (CSV)</div>
  <div class="card actions"><button class="btn btn-g sm" data-exp="usuarios">Participantes y avance</button><button class="btn btn-g sm" data-exp="comentarios">Comentarios de sesiones</button><button class="btn btn-g sm" data-exp="eposters">E-pósters visitados</button><span class="muted">Se abren en Excel. Separador: punto y coma.</span></div>`;
  document.querySelectorAll('[data-exp]').forEach(b=>b.onclick=async()=>{const csv=await api('admin_export',{tipo:b.dataset.exp});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=`adeci26-${b.dataset.exp}.csv`;a.click();});
}

// ───────── avisos ─────────
async function avisos(){
  const d=await api('avisos');
  $('#wrap').innerHTML=`<div class="grid" style="grid-template-columns:1fr 1.4fr">
    <div class="card"><div class="b" style="font-size:16px;margin-bottom:10px">Publicar aviso</div>
      <form id="fa"><div class="field"><label>Título (corto)</label><input name="titulo" maxlength="80" placeholder="Ej.: Cambio de horario"></div>
      <div class="field"><label>Texto</label><textarea name="texto" maxlength="400" placeholder="Ej.: La sesión de las 14:45 comienza a las 15:00."></textarea></div>
      <button class="btn btn-p full">Publicar</button><div class="help">Aparece arriba de la pantalla “Ahora” en todos los celulares en menos de un minuto.</div></form></div>
    <div><div class="sec-t" style="margin-top:0">Publicados</div>${d.avisos.length?d.avisos.map(a=>`<div class="card"><div class="row"><div class="grow"><div class="b">${esc(a.titulo)}</div><div class="small" style="color:var(--txt-2)">${esc(a.texto)}</div><div class="muted">${fecha(a.at)} · ${esc(a.por||'')}</div></div><button class="btn btn-w sm" data-del="${a.id}">Borrar</button></div></div>`).join(''):'<div class="empty">Sin avisos.</div>'}</div></div>`;
  $('#fa').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await api('admin_avisos_add',{titulo:fd.get('titulo'),texto:fd.get('texto')});toast('Aviso publicado');render();}catch(er){toast(er.message,true);}};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('¿Borrar este aviso?')){await api('admin_avisos_del',{id:b.dataset.del});render();}});
}

// ───────── trivia ─────────
let triviaDia=1;
async function trivia(){
  const d=await api('admin_trivia_get');
  const qs=(d[triviaDia]||[]);
  while(qs.length<3) qs.push({texto:'',opciones:['','','',''],correcta:0,explicacion:''});
  $('#wrap').innerHTML=`<div class="days" style="padding:0 0 14px;max-width:420px">${DIAS.map(x=>`<button class="${x.n===triviaDia?'on':''}" data-td="${x.n}">${x.label} · Día ${x.n}</button>`).join('')}</div>
  <form id="ft">${qs.map((q,i)=>`<div class="q" data-i="${i}"><div class="b" style="margin-bottom:8px">Pregunta ${i+1}</div>
    <div class="field"><input name="texto" value="${esc(q.texto)}" placeholder="Enunciado de la pregunta" maxlength="300"></div>
    <div class="opts">${[0,1,2,3].map(j=>`<label style="display:flex;gap:6px;align-items:center;font-size:12px;font-weight:800;color:var(--txt-3)"><input type="radio" name="c${i}" value="${j}" ${Number(q.correcta)===j?'checked':''}> ${'ABCD'[j]}</label><input name="op" value="${esc(q.opciones?.[j]||'')}" placeholder="Opción ${'ABCD'[j]}" maxlength="160" style="border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px">`).join('')}</div>
    <div class="field" style="margin-top:8px"><input name="explicacion" value="${esc(q.explicacion||'')}" placeholder="Explicación breve que ve el asistente después de responder" maxlength="400"></div></div>`).join('')}
    <div class="actions"><button class="btn btn-p">Guardar trivia del día ${triviaDia}</button><span class="muted">Marcá con el círculo cuál es la opción correcta. Las preguntas sin enunciado se ignoran.</span></div></form>`;
  document.querySelectorAll('[data-td]').forEach(b=>b.onclick=()=>{triviaDia=Number(b.dataset.td);render();});
  $('#ft').onsubmit=async e=>{e.preventDefault();const preguntas=[...document.querySelectorAll('.q')].map((el,i)=>({texto:el.querySelector('[name=texto]').value,opciones:[...el.querySelectorAll('[name=op]')].map(x=>x.value),correcta:Number(el.querySelector(`[name=c${i}]:checked`)?.value||0),explicacion:el.querySelector('[name=explicacion]').value}));try{const r=await api('admin_trivia_save',{dia:triviaDia,preguntas});toast(`Guardadas ${r.cantidad} preguntas`);}catch(er){toast(er.message,true);}};
}

// ───────── sorteo ─────────
let excluir=[];
async function sorteo(){
  const d=await api('admin_sorteos_list');
  $('#wrap').innerHTML=`<div class="grid" style="grid-template-columns:1fr 1fr">
    <div>
      <div class="card"><div class="b" style="font-size:16px">Sortear</div>
        <div class="field mt-s"><label>Participan</label><select id="modo"><option value="completos">Quienes completaron los 5 momentos</option><option value="visitas">Todos los que fueron escaneados en el stand</option></select></div>
        <button class="btn btn-teal full" id="btnSorteo" style="font-size:16px;padding:16px">🎲 Sortear</button>
        <div class="help">Si la persona sorteada no está presente, marcala como ausente y volvé a sortear: queda excluida de los siguientes intentos de esta ronda.</div>
        <div class="actions mt-s"><button class="btn btn-w sm" id="reset">Nueva ronda (limpiar excluidos)</button><span class="muted" id="exc">${excluir.length} excluido/s</span></div>
      </div>
      <div id="win"></div>
    </div>
    <div><div class="sec-t" style="margin-top:0">Historial</div><div class="card" style="padding:0;overflow:hidden"><table><tr><th>Cuándo</th><th>Persona</th><th>Criterio</th><th>Estado</th></tr>
      ${d.sorteos.length?d.sorteos.map(s=>`<tr><td style="white-space:nowrap">${fecha(s.at)}</td><td><b>${esc(s.nombre)} ${esc(s.apellido)}</b><br><span class="muted">${esc(s.email)}</span></td><td class="muted">${s.modo==='visitas'?'visitas':'5/5'} · ${s.candidatos} cand.</td><td>${s.estado==='entregado'?'<span class="pill g">Entregado</span>':s.estado==='ausente'?'<span class="pill r">Ausente</span>':`<button class="btn btn-g sm" data-ok="${s.id}">Entregado</button> <button class="btn btn-w sm" data-no="${s.id}" data-uid="${s.uid}">Ausente</button>`}</td></tr>`).join(''):'<tr><td colspan="4" class="muted">Todavía no se sorteó.</td></tr>'}</table></div></div></div>`;
  $('#btnSorteo').onclick=async()=>{const b=$('#btnSorteo');b.disabled=true;b.textContent='Sorteando…';await new Promise(r=>setTimeout(r,900));try{const r=await api('admin_sorteo',{modo:$('#modo').value,excluir});if(!r.ok){toast(r.mensaje,true);}else{$('#win').innerHTML=`<div class="winner mt"><div class="lb" style="font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--celeste);font-weight:800">Salió sorteado/a</div><div class="n">${esc(r.ganador.nombre)} ${esc(r.ganador.apellido)}</div><div class="e">${esc(r.ganador.email)} · entre ${r.candidatos} participantes</div><div class="actions mt" style="justify-content:center"><button class="btn btn-w" data-ok="${r.id}">✓ Está presente, entregado</button><button class="btn btn-o" data-no="${r.id}" data-uid="${r.ganador.uid}">Ausente, sortear otro</button></div></div>`;bind();}}catch(er){toast(er.message,true);}b.disabled=false;b.textContent='🎲 Sortear';};
  $('#reset').onclick=()=>{excluir=[];$('#exc').textContent='0 excluido/s';toast('Ronda nueva');};
  function bind(){document.querySelectorAll('[data-ok]').forEach(b=>b.onclick=async()=>{await api('admin_sorteo_marcar',{id:b.dataset.ok,estado:'entregado'});toast('Marcado como entregado');render();});
    document.querySelectorAll('[data-no]').forEach(b=>b.onclick=async()=>{await api('admin_sorteo_marcar',{id:b.dataset.no,estado:'ausente'});if(b.dataset.uid&&!excluir.includes(b.dataset.uid))excluir.push(b.dataset.uid);toast('Marcado como ausente. Podés volver a sortear.');render();});}
  bind();
}

// ───────── staff ─────────
async function staff(){
  const d=await api('admin_staff_list');
  $('#wrap').innerHTML=`<div class="grid" style="grid-template-columns:1fr 1.4fr">
    <div class="card"><div class="b" style="font-size:16px;margin-bottom:10px">Habilitar persona del stand</div>
      <form id="fs"><div class="field"><label>Nombre</label><input name="nombre" maxlength="80"></div><div class="field"><label>Correo</label><input name="email" type="email" required></div><button class="btn btn-p full">Habilitar</button>
      <div class="help">Entran en <b>/staff.html</b> con su correo y el PIN del stand (definido en Netlify como STAFF_PIN).</div></form></div>
    <div><div class="sec-t" style="margin-top:0">Habilitados (${d.staff.length})</div><div class="card" style="padding:0;overflow:hidden"><table>${d.staff.length?d.staff.map(s=>`<tr><td><b>${esc(s.nombre||'—')}</b></td><td>${esc(s.email)}</td><td style="text-align:right"><button class="btn btn-w sm" data-del="${esc(s.email)}">Quitar</button></td></tr>`).join(''):'<tr><td class="muted">Nadie habilitado todavía.</td></tr>'}</table></div></div></div>`;
  $('#fs').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await api('admin_staff_add',{nombre:fd.get('nombre'),email:fd.get('email')});toast('Habilitado');render();}catch(er){toast(er.message,true);}};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('¿Quitar acceso a '+b.dataset.del+'?')){await api('admin_staff_del',{email:b.dataset.del});render();}});
}

// ───────── programa (overrides) ─────────
async function programa(){
  const c=await api('admin_config_get'); const ov=c.overrides||{};
  $('#wrap').innerHTML=`<div class="card"><div class="b" style="font-size:16px">Cambios de último momento</div><div class="muted small">Completá solo lo que cambia. Título vacío = se usa el original. Si escribís “Participan”, reemplaza la lista de speakers de esa sesión por ese texto (sin fotos). Los horarios no se editan desde acá.</div></div>
  <form id="fp"><div class="card" style="padding-top:4px">${PROGRAMA.filter(s=>!['pausa','posters'].includes(s.tipo)).map(s=>`<div class="ov" data-id="${s.id}"><div><b>${DIAS.find(d=>d.n===s.dia).corto} ${s.ini}</b><div class="orig">${s.id}</div></div>
    <div><input name="titulo" value="${esc(ov[s.id]?.titulo||'')}" placeholder="Nuevo título"><div class="orig">${esc(s.titulo)}</div></div>
    <div><input name="participantes" value="${esc(ov[s.id]?.participantes||'')}" placeholder="Participan (texto libre)"><div class="orig">${esc((s.roles||[]).flatMap(r=>r.ids.map(id=>speaker(id).nombre)).join(' · ')||'—')}</div></div></div>`).join('')}</div>
  <button class="btn btn-p">Guardar cambios</button></form>`;
  $('#fp').onsubmit=async e=>{e.preventDefault();const overrides={};document.querySelectorAll('.ov').forEach(el=>{const t=el.querySelector('[name=titulo]').value.trim(),p=el.querySelector('[name=participantes]').value.trim();if(t||p)overrides[el.dataset.id]={titulo:t,participantes:p};});try{await api('admin_config_save',{overrides});toast('Programa actualizado');}catch(er){toast(er.message,true);}};
}

// ───────── config ─────────
async function config(){
  const c=await api('admin_config_get');
  $('#wrap').innerHTML=`<form id="fc" class="card" style="max-width:640px">
    <div class="field"><label>Libro de resúmenes (URL del PDF)</label><input name="libroUrl" value="${esc(c.libroUrl||'')}" placeholder="https://adeci.org.ar/congresos/2026/img/libro-resumenes.pdf"><div class="help">Vacío = la app muestra “Disponible próximamente”.</div></div>
    <div class="field"><label>Ubicación del stand ADOX</label><input name="standTexto" value="${esc(c.standTexto||'')}" placeholder="Stand de ADOX · hall central"></div>
    <div class="field"><label>Texto del sorteo</label><textarea name="sorteoInfo" maxlength="300" placeholder="Ej.: El sorteo es el viernes a las 16:00 en el stand de ADOX. Hay que estar presente.">${esc(c.sorteoInfo||'')}</textarea><div class="help">Se muestra en el juego y en la pantalla de ADOX. Cuando ADOX defina el horario, escribilo acá.</div></div>
    <button class="btn btn-p">Guardar</button></form>
    <div class="card mt" style="max-width:640px"><div class="b">Accesos</div><div class="small" style="color:var(--txt-2);line-height:1.6">App de asistentes: <b>${location.origin}/</b><br>Escáner del stand: <b>${location.origin}/staff.html</b><br>Este panel: <b>${location.origin}/admin.html</b></div></div>`;
  $('#fc').onsubmit=async e=>{e.preventDefault();const fd=new FormData(e.target);try{await api('admin_config_save',{libroUrl:fd.get('libroUrl'),standTexto:fd.get('standTexto'),sorteoInfo:fd.get('sorteoInfo')});toast('Guardado');}catch(er){toast(er.message,true);}};
}

render();
</script>
</body>
</html>
